<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr Zulfiqar Ali Jalbani - Sindhi AI</title>
<style>
body{font-family:Arial;background:#e8f5e9;margin:0;padding:15px;display:flex;justify-content:center}
.box{background:white;max-width:650px;width:100%;border-radius:20px;padding:25px;box-shadow:0 5px 20px rgba(0,0,0,0.1);border-top:6px solid #1b7a3d}
h1{text-align:center;margin:0;font-size:28px} h3{text-align:center;color:#1b7a3d;margin-top:8px}
input{width:100%;padding:14px;border:2px solid #ccc;border-radius:10px;box-sizing:border-box;margin-top:15px;font-size:16px}
button{width:100%;margin-top:12px;background:#1b7a3d;color:white;padding:14px;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer}
#ans{margin-top:15px;background:#f1f8f1;padding:15px;border-radius:10px;border-left:5px solid #1b7a3d;display:none;white-space:pre-wrap;line-height:1.6;font-size:15px}
#load{display:none;text-align:center;color:#1b7a3d;margin-top:12px;font-weight:bold}
.small{text-align:center;color:#666;font-size:12px;margin-top:15px}
</style>
</head>
<body>
<div class="box">
<h1>Dr. Zulfiqar Ali Jalbani</h1>
<h3>Sindhi AI Assistant - FINAL</h3>
<input id="q" placeholder="Sawal likho... e.g. Sindhi boli ji tareekh">
<button onclick="ask()">Jawab Hasil Karo</button>
<div id="load">AI jawab likh raha hai... 5 second ⏳</div>
<div id="ans"></div>
<div class="small">No Limit • Never Fails • Fast Server</div>
</div>
<script>
async function ask(){
let qq=document.getElementById('q').value.trim();
let a=document.getElementById('ans');
let l=document.getElementById('load');
if(!qq){alert('Meharbani kare sawal likho');return;}
l.style.display='block';a.style.display='none';a.innerText='';
let prompt="You are Dr Zulfiqar's Sindhi AI expert. Answer briefly in Roman Sindhi, respectful, helpful. Question: "+qq;
try{
let res=await fetch('https://ai.hackclub.com/chat/completions',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({model:'qwen/qwen3-32b',messages:[{role:'user',content:prompt}]})
});
let data=await res.json();
let text=data.choices[0].message.content;
a.style.display='block';a.innerText=text;
}catch(e){
a.style.display='block';
a.innerText='Server thoro busy aahe, 10 second baad dobara koshish kayo. \nError: '+e;
}
l.style.display='none';
}
</script>
</body>
</html>

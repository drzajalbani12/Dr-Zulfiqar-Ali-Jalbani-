
<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ڊاڪٽر ذوالفقار علي جلباڻي | سنڌي AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 12px;
      font-family: "Noto Sans Arabic", "Arial", sans-serif;
      background: #f0f7f1;
      color: #173b27;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 22px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 22px #00000012;
    }

    .profile {
      margin: 0 auto 14px;
    }

    .profile img {
      display: block;
      width: 140px;
      height: 140px;
      margin: auto;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      border: 4px solid #168044;
      box-shadow: 0 4px 14px #0002;
    }

    h1 {
      color: #08763b;
      font-size: 25px;
      line-height: 1.6;
      margin: 8px 0;
    }

    .subtitle {
      color: #52665a;
      line-height: 1.9;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      padding: 14px;
      font-size: 17px;
      font-family: inherit;
      border: 1px solid #b8d5c0;
      border-radius: 12px;
      resize: vertical;
      outline-color: #168044;
      text-align: right;
    }

    button {
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 12px 17px;
      margin: 5px;
    }

    .ask {
      background: #08763b;
      color: white;
      width: 100%;
      margin: 12px 0;
    }

    .secondary {
      background: #e3f2e7;
      color: #075e30;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #answer {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #f4f8f4;
      text-align: right;
      line-height: 2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      min-height: 45px;
    }

    .footer {
      font-size: 13px;
      color: #68796d;
      margin-top: 22px;
      line-height: 1.8;
    }

    a { color: #08763b; }
  </style>
</head>

<body>
  <main class="container">

    <div class="profile">
      <img
        src="./zulfiqar.jpg"
        alt="ڊاڪٽر ذوالفقار علي جلباڻي"
        onerror="this.onerror=null;this.src='https://placehold.co/140x140/e3f2e7/08763b?text=Zulfiqar';"
      >
    </div>

    <h1>سنڌي AI</h1>

    <div class="subtitle">
      ڊاڪٽر ذوالفقار علي جلباڻي<br>
      سنڌي ٻولي، ادب، تاريخ ۽ عام معلومات لاءِ آن لائين مددگار
    </div>

    <textarea
      id="question"
      placeholder="پنهنجو سوال سنڌي، اردو يا انگريزيءَ ۾ لکو..."
    ></textarea>

    <button class="ask" id="askBtn" onclick="askAI()">
      جواب حاصل ڪريو
    </button>

    <div>
      <button class="secondary" onclick="setQuestion('شاهه عبداللطيف ڀٽائي بابت ٻڌايو')">
        شاهه لطيف
      </button>
      <button class="secondary" onclick="setQuestion('سنڌي ٻوليءَ جي تاريخ ٻڌايو')">
        سنڌي ٻولي
      </button>
      <button class="secondary" onclick="setQuestion('موهن جو دڙو ڇا آهي؟')">
        موهن جو دڙو
      </button>
      <button class="secondary" onclick="setQuestion('سنڌ جي ثقافت بابت ٻڌايو')">
        سنڌي ثقافت
      </button>
    </div>

    <button class="secondary" onclick="window.open('https://dic.sindhila.edu.pk/','_blank','noopener')">
      سنڌي لغت کوليو
    </button>

    <div id="answer" aria-live="polite">
      توهان جو سوال هتي جواب سان گڏ ظاهر ٿيندو.
    </div>

    <div class="footer">
      سنڌي ٻولي ۽ علم جي واڌاري لاءِ هڪ تعليمي ڪوشش
    </div>
  </main>

  <script>
    function setQuestion(text) {
      document.getElementById("question").value = text;
      document.getElementById("question").focus();
    }

    async function askAI() {
      const question = document.getElementById("question").value.trim();
      const answerBox = document.getElementById("answer");
      const button = document.getElementById("askBtn");

      if (!question) {
        answerBox.textContent = "مهرباني ڪري پهرين پنهنجو سوال لکو.";
        return;
      }

      button.disabled = true;
      answerBox.textContent = "مهرباني ڪري انتظار ڪريو، جواب تيار ٿي رهيو آهي...";

      const prompt =
        "توهان سنڌي ٻوليءَ جا مددگار آهيو. هر سوال جو جواب سنڌي عربي رسم الخط ۾ ڏيو. " +
        "جواب درست، واضح، احترام وارو ۽ مناسب تفصيل سان هجي. " +
        "جيڪڏهن سوال سنڌي ادب، تاريخ، ثقافت يا عام معلومات بابت هجي ته وضاحت سان جواب ڏيو. " +
        "جيڪڏهن پڪ نه هجي ته غير يقيني ڳالهه کي حقيقت طور پيش نه ڪريو. " +
        "سوال: " + question;

      try {
        const url = "https://text.pollinations.ai/" + encodeURIComponent(prompt);
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Online service error");
        }

        const result = await response.text();
        const cleanResult = result.trim();

        if (!cleanResult) {
          throw new Error("Empty answer");
        }

        answerBox.textContent = cleanResult;
      } catch (error) {
        answerBox.textContent =
          "معاف ڪجو، هن وقت آن لائين جواب حاصل نه ٿي سگهيو. " +
          "مهرباني ڪري انٽرنيٽ چيڪ ڪريو ۽ ٻيهر ڪوشش ڪريو. " +
          "سنڌي لغت لاءِ مٿي ڏنل لغت وارو بٽڻ استعمال ڪريو.";
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById("question").addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        askAI();
      }
    });
  </script>
</body>
</html>

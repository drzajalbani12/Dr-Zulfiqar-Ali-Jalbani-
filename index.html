
<!DOCTYPE html>
<html lang="sd">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Zulfiqar Ali Jalbani - Sindhi AI</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #e8f5e9;
  margin: 0;
  padding: 15px;
  display: flex;
  justify-content: center;
  direction: rtl;
}

.box {
  background: white;
  max-width: 700px;
  width: 100%;
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 5px 20px #0002;
  border-top: 6px solid #1b7a3d;
}

h1, h3 { text-align: center; }
h1 { font-size: 25px; color: #174d2b; }
h3 { color: #1b7a3d; }

.desc {
  text-align: center;
  line-height: 1.8;
}

input {
  width: 100%;
  padding: 14px;
  border: 2px solid #ccc;
  border-radius: 10px;
  margin-top: 15px;
  font-size: 17px;
  direction: rtl;
}

button {
  width: 100%;
  margin-top: 12px;
  background: #1b7a3d;
  color: white;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  font-size: 17px;
  cursor: pointer;
}

.keys {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.keys button {
  width: auto;
  flex: 1 1 40%;
  font-size: 14px;
  padding: 10px;
  background: #e8f5e9;
  color: #165c30;
  border: 1px solid #1b7a3d;
}

#ans {
  margin-top: 15px;
  background: #f1f8f1;
  padding: 15px;
  border-radius: 10px;
  border-right: 5px solid #1b7a3d;
  display: none;
  white-space: pre-wrap;
  line-height: 2;
  direction: rtl;
  text-align: right;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  color: #777;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>

<body>
<div class="box">

<h1>ڊاڪٽر ذوالفقار علي جلباڻي</h1>
<h3>سنڌي مصنوعي ذهانت وارو مددگار</h3>

<p class="desc">
سنڌي ٻولي، ادب، تاريخ ۽ ثقافت بابت سوال پڇو.
جواب سنڌي رسم الخط ۾ حاصل ڪريو.
</p>

<input id="q" type="text" placeholder="هتي سنڌيءَ ۾ سوال لکو...">

<button id="askButton" onclick="ask()">جواب حاصل ڪريو</button>

<div class="keys">
<button onclick="setQ('سنڌي ٻولي جي تاريخ')">سنڌي ٻولي</button>
<button onclick="setQ('شاهه عبداللطيف ڀٽائي ڪير هو؟')">شاهه لطيف</button>
<button onclick="setQ('سنڌي ثقافت ڇا آهي؟')">سنڌي ثقافت</button>
<button onclick="setQ('موهن جو دڙو ڇا آهي؟')">موهن جو دڙو</button>
<button onclick="setQ('سنڌي ٽوپي ۽ اجرڪ جي اهميت ٻڌايو')">ٽوپي ۽ اجرڪ</button>
</div>

<div id="ans" aria-live="polite"></div>

<footer>
ڊاڪٽر ذوالفقار علي جلباڻي جو سنڌي AI منصوبو
</footer>

</div>

<script>
const knowledge = [
{
keys: ["سنڌي ٻولي", "سنڌي زبان"],
answer: "سنڌي ٻولي سنڌ جي هڪ شاهوڪار ۽ ادبي ٻولي آهي. ان جي پنهنجي رسم الخط، شاعري، نثر ۽ علمي روايت آهي. سنڌي ادب ۾ لوڪ ڪهاڻين، صوفي شاعري ۽ تاريخ کي اهم مقام حاصل آهي."
},
{
keys: ["تاريخ", "سنڌ جي تاريخ"],
answer: "سنڌ جي تاريخ قديم تهذيبن، سنڌو درياهه، علم، ادب ۽ ثقافت سان لاڳاپيل آهي. موهن جو دڙو سنڌو ماٿريءَ جي قديم شهري تهذيب جو مشهور آثار قديمه وارو ماڳ آهي."
},
{
keys: ["شاهه لطيف", "ڀٽائي", "شاهه عبداللطيف"],
answer: "شاهه عبداللطيف ڀٽائي سنڌ جو عظيم صوفي شاعر هو. سندس مشهور ڪتاب شاهه جو رسالو آهي. سندس شاعريءَ ۾ محبت، انسانيت، سچائي، صبر ۽ روحانيت جا موضوع ملن ٿا."
},
{
keys: ["ثقافت", "سنڌي ثقافت"],
answer: "سنڌي ثقافت مهمان نوازي، محبت، لوڪ موسيقي، شاعري، اجرڪ، سنڌي ٽوپي ۽ روايتي هنر جي ڪري مشهور آهي. سنڌ جي ثقافت امن، ڀائيچاري ۽ انسانيت جو پيغام ڏئي ٿي."
},
{
keys: ["موهن جو دڙو", "موئن جو دڙو"],
answer: "موهن جو دڙو سنڌ جي لاڙڪاڻي ضلعي ۾ واقع قديم آثارن وارو ماڳ آهي. اهو سنڌو ماٿريءَ جي تهذيب سان لاڳاپيل آهي ۽ قديم شهرن جي منصوبابندي، نيڪال جي نظام ۽ اڏاوتن جي ڪري مشهور آهي."
},
{
keys: ["اجرڪ", "ٽوپي"],
answer: "سنڌي اجرڪ ۽ ٽوپي سنڌ جي ثقافتي سڃاڻپ جا اهم نشان آهن. اهي سنڌي روايتن، عزت، محبت ۽ مهمان نوازيءَ جي نمائندگي ڪن ٿا."
}
];

function setQ(value) {
  document.getElementById("q").value = value;
  ask();
}

async function ask() {
  const input = document.getElementById("q");
  const answerBox = document.getElementById("ans");
  const button = document.getElementById("askButton");
  const originalQuestion = input.value.trim();

  if (!originalQuestion) {
    alert("مهرباني ڪري پهريان پنهنجو سوال لکو.");
    return;
  }

  answerBox.style.display = "block";

  const question = originalQuestion.toLowerCase();

  const found = knowledge.find(item =>
    item.keys.some(key => question.includes(key.toLowerCase()))
  );

  if (found) {
    answerBox.textContent = found.answer +
      "\n\n— ڊاڪٽر ذوالفقار علي جلباڻي";
    return;
  }

  button.disabled = true;
  button.textContent = "جواب حاصل ٿي رهيو آهي...";
  answerBox.textContent = "مهرباني ڪري انتظار ڪريو...";

  try {
    const response = await fetch(
      "https://ai.hackclub.com/proxy/v1/chat/completions",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "qwen/qwen3-32b",
          messages: [
            {
              role: "system",
              content:
                "توهان سنڌي ٻولي، ادب، تاريخ ۽ ثقافت جا مددگار آهيو. هر سوال جو جواب سنڌي ٻوليءَ ۾ سنڌي عربي-بنياد واري رسم الخط سان ڏيو. رومن سنڌي يا انگريزي اکرن ۾ جواب نه ڏيو. جواب سادو، صحيح ۽ سوال مطابق هجي. جيڪڏهن ڄاڻ پڪي نه هجي ته ان ڳالهه جو صاف ذڪر ڪريو. انگريزيءَ ۾ سوال هجي تڏهن به جواب سنڌي رسم الخط ۾ ڏيو."
            },
            {
              role: "user",
              content: originalQuestion
            }
          ]
        })
      }
    );

    if (!response.ok) {
      throw new Error("AI سروس هن وقت جواب نٿي ڏئي.");
    }

    const data = await response.json();
    const result = data.choices?.[0]?.message?.content;

    if (!result) {
      throw new Error("جواب حاصل نه ٿي سگهيو.");
    }

    answerBox.textContent = result +
      "\n\n— ڊاڪٽر ذوالفقار علي جلباڻي";

  } catch (error) {
    answerBox.textContent =
      "معاف ڪجو، هن وقت آن لائن AI کان جواب حاصل نه ٿي سگهيو.\n\n" +
      "مهرباني ڪري ٿوري دير کان پوءِ ٻيهر ڪوشش ڪريو. توهان مٿي ڏنل سنڌي موضوعن جا بٽڻ به استعمال ڪري سگهو ٿا.\n\n" +
      "نوٽ: آن لائن AI جي ڪم ڪرڻ لاءِ لاڳاپيل سرور ۽ ان جي رسائي موجود هجڻ ضروري آهي.";
  } finally {
    button.disabled = false;
    button.textContent = "جواب حاصل ڪريو";
  }
}

document.getElementById("q").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    ask();
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr Zulfiqar Ali Jalbani - Sindhi AI PRO</title>
<style>
body{font-family:Arial;background:#e8f5e9;margin:0;padding:15px;display:flex;justify-content:center}
.box{background:white;max-width:600px;width:100%;border-radius:20px;padding:25px;box-shadow:0 5px 20px rgba(0,0,0,0.1);border-top:6px solid #1b7a3d}
h1{text-align:center} h3{text-align:center;color:#1b7a3d}
input{width:100%;padding:14px;border:2px solid #ccc;border-radius:10px;box-sizing:border-box}
button{width:100%;margin-top:12px;background:#1b7a3d;color:white;padding:14px;border:none;border-radius:10px;font-size:18px;font-weight:bold}
#ans{margin-top:15px;background:#f1f8f1;padding:15px;border-radius:10px;border-left:4px solid #1b7a3d;display:none;white-space:pre-wrap}
#load{display:none;text-align:center;color:#1b7a3d;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h1>Dr. Zulfiqar Ali Jalbani</h1>
<h3>Sindhi AI Assistant - PRO</h3>
<input id="q" placeholder="Sawal likho... Sindhi boli bare me">
<button onclick="ask()">Jawab Hasil Karo</button>
<div id="load">AI soch raha hai...</div>
<div id="ans"></div>
</div>
<script>
async function ask(){
let qq=document.getElementById('q').value.trim();
let a=document.getElementById('ans');
let l=document.getElementById('load');
if(!qq){alert('Sawal likho');return;}
l.style.display='block';a.style.display='none';
try{
let prompt="You are Sindhi AI expert Dr Zulfiqar, answer in Roman Sindhi simple, respectful. Question: "+qq;
let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt));
let t=await r.text();
a.style.display='block';a.innerText=t;
}catch(e){a.style.display='block';a.innerText='Internet slow hai, dobara koshish karo. Sawal: '+qq;}
l.style.display='none';
}
</script>
</body>
</html>

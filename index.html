
<!DOCTYPE html>
<html lang="sd">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Zulfiqar Ali Jalbani - Sindhi AI</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #e8f5e9;
  margin: 0;
  padding: 15px;
  display: flex;
  justify-content: center;
}
.box {
  background: white;
  max-width: 700px;
  width: 100%;
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 5px 20px #0002;
  border-top: 6px solid #1b7a3d;
}
h1, h3 { text-align: center; }
h1 { font-size: 25px; }
h3 { color: #1b7a3d; }
input {
  width: 100%;
  padding: 14px;
  border: 2px solid #ccc;
  border-radius: 10px;
  box-sizing: border-box;
  margin-top: 15px;
  font-size: 16px;
}
button {
  width: 100%;
  margin-top: 12px;
  background: #1b7a3d;
  color: white;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
}
.keys {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.keys button {
  width: auto;
  flex: 1 1 40%;
  font-size: 14px;
  padding: 10px;
  background: #e8f5e9;
  color: #165c30;
  border: 1px solid #1b7a3d;
}
#ans {
  margin-top: 15px;
  background: #f1f8f1;
  padding: 15px;
  border-radius: 10px;
  border-left: 5px solid #1b7a3d;
  display: none;
  white-space: pre-wrap;
  line-height: 1.8;
}
</style>
</head>
<body>
<div class="box">
<h1>ڊاڪٽر ذوالفقار علي جلباڻي</h1>
<h3>Sindhi AI Assistant</h3>
<p style="text-align:center">سنڌي ٻولي، ادب، تاريخ ۽ ثقافت بابت سوال پڇو.</p>

<input id="q" placeholder="پنهنجو سوال لکو..." />
<button onclick="ask()">جواب حاصل ڪريو</button>

<div class="keys">
<button onclick="setQ('سنڌي ٻولي جي تاريخ')">سنڌي ٻولي</button>
<button onclick="setQ('شاهه عبداللطيف ڀٽائي')">شاهه لطيف</button>
<button onclick="setQ('سنڌي ثقافت')">سنڌي ثقافت</button>
<button onclick="setQ('موهن جو دڙو')">موهن جو دڙو</button>
<button onclick="setQ('سنڌي ٽوپي ۽ اجرڪ')">ٽوپي ۽ اجرڪ</button>
</div>

<div id="ans"></div>
<p style="text-align:center;color:#888;font-size:12px">
ڊاڪٽر ذوالفقار علي جلباڻي جو سنڌي AI منصوبو
</p>
</div>

<script>
const knowledge = [
{
keys: ["سنڌي ٻولي", "sindhi language", "sindhi boli"],
answer: "سنڌي ٻولي سنڌ جي هڪ اهم ۽ شاهوڪار ٻولي آهي. ان جي پنهنجي رسم الخط، ادب، شاعري ۽ علمي روايت آهي. سنڌي ٻولي پاڪستان جي آئيني طور تسليم ٿيل علائقائي ٻولين مان هڪ آهي."
},
{
keys: ["تاريخ", "history"],
answer: "سنڌ جي تاريخ قديم تهذيبن سان لاڳاپيل آهي. موهن جو دڙو سنڌو ماٿري جي تهذيب جو هڪ مشهور آثار قديمه وارو ماڳ آهي."
},
{
keys: ["شاهه لطيف", "shah latif", "ڀٽائي"],
answer: "شاهه عبداللطيف ڀٽائي سنڌ جو عظيم صوفي شاعر هو. سندس مشهور شاعري جو مجموعو شاهه جو رسالو آهي. سندس ڪلام ۾ محبت، انسانيت، صبر ۽ روحانيت جا موضوع ملن ٿا."
},
{
keys: ["ثقافت", "culture"],
answer: "سنڌي ثقافت پنهنجي مهمان نوازي، ٻولي، لوڪ موسيقي، شاعري، اجرڪ، سنڌي ٽوپي ۽ روايتي هنر جي ڪري مشهور آهي."
},
{
keys: ["موهن جو دڙو", "moen jo daro", "mohenjo daro"],
answer: "موهن جو دڙو لاڙڪاڻي ضلعي، سنڌ ۾ واقع سنڌو ماٿري جي تهذيب جو اهم آثار قديمه وارو ماڳ آهي. اهو لڳ ڀڳ ٽئين هزارين سال قبل مسيح جي شهري تهذيب سان لاڳاپيل آهي."
},
{
keys: ["اجرڪ", "ٽوپي", "ajrak", "topi"],
answer: "سنڌي اجرڪ ۽ ٽوپي سنڌ جي ثقافتي سڃاڻپ جا اهم نشان آهن. اهي محبت، مهمان نوازي، عزت ۽ سنڌي روايتن جي نمائندگي ڪن ٿا."
}
];

function setQ(value) {
  document.getElementById("q").value = value;
  ask();
}

async function ask() {
  const input = document.getElementById("q");
  const answerBox = document.getElementById("ans");
  const question = input.value.trim().toLowerCase();

  if (!question) {
    alert("مهرباني ڪري سوال لکو.");
    return;
  }

  answerBox.style.display = "block";

  const found = knowledge.find(item =>
    item.keys.some(key => question.includes(key.toLowerCase()))
  );

  if (found) {
    answerBox.textContent = found.answer +
      "\n\n— ڊاڪٽر ذوالفقار علي جلباڻي سنڌي AI";
    return;
  }

  answerBox.textContent =
    "توهان جو سوال محفوظ طريقي سان آن لائن AI ڏانهن موڪلڻ جي ڪوشش ڪئي پئي وڃي...";

  try {
    const response = await fetch(
      "https://ai.hackclub.com/proxy/v1/chat/completions",
      {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          model: "qwen/qwen3-32b",
          messages: [{
            role: "user",
            content:
              "Answer accurately in Sindhi language, preferably Sindhi script. If unsure, say so. Question: " +
              input.value
          }]
        })
      }
    );

    if (!response.ok) {
      throw new Error("آن لائن سروس هن وقت دستياب ناهي.");
    }

    const data = await response.json();
    const result = data.choices?.[0]?.message?.content;

    if (!result) {
      throw new Error("جواب حاصل نه ٿي سگهيو.");
    }

    answerBox.textContent = result +
      "\n\n— ڊاڪٽر ذوالفقار علي جلباڻي سنڌي AI";

  } catch (error) {
    answerBox.textContent =
      "معاف ڪجو، آن لائن AI سرور هن وقت جواب نٿو ڏئي.\n\n" +
      "مهرباني ڪري ٿوري دير کان پوءِ ٻيهر ڪوشش ڪريو، يا مٿي ڏنل سنڌي موضوعن مان ڪو هڪ چونڊيو.\n\n" +
      "نوٽ: هن وقت آن لائن AI جي دستيابي جي ضمانت نٿي ڏئي سگهجي.";
  }
}

document.getElementById("q").addEventListener("keydown", function(event) {
  if (event.key === "Enter") ask();
});
</script>
</body>
</html>

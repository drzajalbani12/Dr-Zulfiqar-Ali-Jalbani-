
<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="سنڌي ٻولي، ادب، تاريخ ۽ عام معلومات لاءِ سنڌي AI مددگار">
<title>ڊاڪٽر ذوالفقار علي جلباڻي | سنڌي AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px 12px;
  background: #f0f7f1;
  color: #173b27;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 22px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 5px 20px #0002;
}

.profile-photo {
  width: 145px;
  height: 145px;
  display: block;
  margin: 0 auto 15px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center;
  border: 4px solid #168044;
}

h1 {
  color: #08763b;
  line-height: 1.6;
  font-size: 27px;
}

.subtitle {
  line-height: 2;
  color: #52665a;
  margin-bottom: 20px;
}

textarea {
  width: 100%;
  min-height: 110px;
  padding: 14px;
  font-family: inherit;
  font-size: 17px;
  border: 1px solid #b8d5c0;
  border-radius: 12px;
  text-align: right;
  direction: auto;
}

button {
  padding: 12px 16px;
  margin: 5px;
  border: 0;
  border-radius: 10px;
  font-family: inherit;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.ask {
  width: 100%;
  background: #08763b;
  color: white;
  margin: 12px 0;
}

.secondary {
  background: #e3f2e7;
  color: #075e30;
}

#answer {
  margin-top: 18px;
  padding: 16px;
  min-height: 55px;
  background: #f4f8f4;
  border-radius: 12px;
  text-align: right;
  direction: rtl;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 2;
}

.footer {
  margin-top: 20px;
  color: #68796d;
  font-size: 13px;
  line-height: 2;
}

.note {
  color: #65776a;
  font-size: 12px;
  line-height: 1.8;
}

@media (max-width: 480px) {
  .container { padding: 16px; }
  h1 { font-size: 24px; }
  button { font-size: 15px; }
}
</style>
</head>

<body>
<main class="container">

  <img
    class="profile-photo"
    src="./zulfiqar.jpg"
    alt="ڊاڪٽر ذوالفقار علي جلباڻي"
    onerror="this.style.display='none'"
  >

  <h1>سنڌي AI</h1>

  <div class="subtitle">
    ڊاڪٽر ذوالفقار علي جلباڻي<br>
    سنڌي ٻولي، ادب، تاريخ ۽ عام معلومات لاءِ آن لائين مددگار
  </div>

  <textarea id="question"
    placeholder="پنهنجو سوال سنڌي، اردو يا انگريزيءَ ۾ لکو..."
    aria-label="پنهنجو سوال لکو"></textarea>

  <button class="ask" id="askBtn" onclick="askAI()">
    جواب حاصل ڪريو
  </button>

  <div>
    <button class="secondary"
      onclick="setQuestion('شاهه عبداللطيف ڀٽائي بابت ٻڌايو')">
      شاهه لطيف
    </button>

    <button class="secondary"
      onclick="setQuestion('سنڌي ٻوليءَ جي تاريخ ٻڌايو')">
      سنڌي ٻولي
    </button>

    <button class="secondary"
      onclick="setQuestion('موهن جو دڙو ڇا آهي؟')">
      موهن جو دڙو
    </button>

    <button class="secondary"
      onclick="setQuestion('سنڌ جي ثقافت بابت ٻڌايو')">
      سنڌي ثقافت
    </button>

    <button class="secondary"
      onclick="setQuestion('علم ۽ ڄاڻ جي اهميت سنڌيءَ ۾ بيان ڪريو')">
      علم ۽ ڄاڻ
    </button>

    <button class="secondary"
      onclick="setQuestion('Knowledge لفظ جي سنڌي معنيٰ مثال سان ٻڌايو')">
      لفظن جون معنائون
    </button>
  </div>

  <p>
    <button class="secondary"
      onclick="window.open('https://dic.sindhila.edu.pk/','_blank','noopener')">
      سنڌي لغت کوليو
    </button>
  </p>

  <div id="answer" aria-live="polite">
    توهان جو سوال لکو ۽ جواب حاصل ڪريو.
  </div>

  <p class="note">
    بهتر نتيجن لاءِ سوال واضح لکو. آن لائين جواب جي درستگيءَ جي تصديق ڪرڻ ضروري آهي.
  </p>

  <div class="footer">
    سنڌي ٻولي ۽ علم جي واڌاري لاءِ هڪ تعليمي ڪوشش
  </div>

</main>

<script>
function setQuestion(text) {
  document.getElementById("question").value = text;
  document.getElementById("question").focus();
}

async function askAI() {
  const question = document.getElementById("question").value.trim();
  const answerBox = document.getElementById("answer");
  const askBtn = document.getElementById("askBtn");

  if (!question) {
    answerBox.textContent = "مهرباني ڪري پنهنجو سوال لکو.";
    return;
  }

  askBtn.disabled = true;
  answerBox.textContent =
    "جواب حاصل ڪيو پيو وڃي، مهرباني ڪري انتظار ڪريو...";

  const prompt = `
توهان سنڌي ٻوليءَ جا ماهر ۽ سنڌي AI جا مددگار آهيو.

اهم هدايتون:
1. هر سوال جو جواب صاف، فطري، صحيح ۽ معياري سنڌي ٻوليءَ ۾ ڏيو.
2. سنڌي عربي رسم الخط استعمال ڪريو، رومن سنڌي نه لکو.
3. اردو يا هنديءَ ۾ جواب نه ڏيو. سنڌي گرامر ۽ سنڌي لفظن جو صحيح استعمال ڪريو.
4. سنڌي لفظن جي املا، جملن جي بناوت ۽ ٻوليءَ جي روانيءَ جو خاص خيال رکو.
5. سوال سنڌي، اردو يا انگريزيءَ ۾ هجي، جواب سنڌيءَ ۾ ڏيو.
6. شخصيتن، تاريخ، ڪتابن ۽ واقعن بابت غير تصديق ٿيل معلومات نه ٺاهيو.
7. جيڪڏهن معلومات پڪ سان معلوم نه هجي ته صاف ٻڌايو.
8. سوال جي ضرورت مطابق آسان وضاحت ۽ مثال ڏيو.
9. جيڪڏهن انگريزي لفظ جي معنيٰ پڇي وڃي ته سنڌي معنيٰ ۽ مثال ڏيو.
10. جواب مختصر، لاڳاپيل ۽ پڙهڻ ۾ آسان رکو.
11. جواب ۾ سنڌيءَ جي معياري ۽ درست لکڻيءَ کي ترجيح ڏيو.
12. صرف سوال جو جواب ڏيو؛ غير ضروري تمهيد نه لکو.

استعمال ڪندڙ جو سوال:
${question}

جواب سنڌي عربي رسم الخط ۾ ڏيو:
`;

  try {
    const url =
      "https://text.pollinations.ai/" + encodeURIComponent(prompt);

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 45000);

    let response;

    try {
      response = await fetch(url, {
        method: "GET",
        signal: controller.signal
      });
    } finally {
      clearTimeout(timeout);
    }

    if (!response.ok) {
      throw new Error("Online service unavailable");
    }

    const result = (await response.text()).trim();

    if (!result) {
      throw new Error("No answer received");
    }

    answerBox.textContent = result;

  } catch (error) {
    answerBox.textContent =
      "معاف ڪجو، هن وقت آن لائين جواب حاصل نه ٿي سگهيو. " +
      "مهرباني ڪري انٽرنيٽ چيڪ ڪريو ۽ ٻيهر ڪوشش ڪريو. " +
      "لفظن جي معنائن لاءِ سنڌي لغت وارو بٽڻ استعمال ڪريو.";
  } finally {
    askBtn.disabled = false;
  }
}

document.getElementById("question").addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    askAI();
  }
});
</script>
</body>
</html>

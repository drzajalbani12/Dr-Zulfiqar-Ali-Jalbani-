<!DOCTYPE html>
<html>
<head>
<title>Dr Zulfiqar Ali Jalbani - Sindhi AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial; background:#f0f8ff; text-align:center; padding:20px;}
.box{background:white; padding:20px; border-radius:15px; box-shadow:0 0 10px gray;}
button{padding:10px 20px; background:green; color:white; border:none; border-radius:8px;}
input{padding:10px; width:80%; border-radius:8px; border:1px solid gray;}
</style>
</head>
<body>
<div class="box">
<h1>Dr. Zulfiqar Ali Jalbani</h1>
<h3>Sindhi AI Assistant</h3>
<p>Sindhi me sawal likho, jawab milega.</p>
<input type="text" id="q" placeholder="Sawal likho...">
<br><br>
<button onclick="jawab()">Jawab Hasil Karo</button>
<p id="ans"></p>
</div>
<script>
function jawab(){
let s = document.getElementById("q").value;
document.getElementById("ans").innerHTML = "Tawhan jo sawal: " + s + "<br><br>Ma Sindhi AI aahiyan, tawhan ji madad kandaus. (Ye demo hai, asal AI agle step me jorege)";
}
</script>
</body>
</html>

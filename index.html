<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr Zulfiqar - Sindhi AI</title>
<style>
body{font-family:Arial;background:#e8f5e9;margin:0;padding:15px;display:flex;justify-content:center}
.box{background:white;max-width:700px;width:100%;border-radius:20px;padding:25px;box-shadow:0 5px 20px rgba(0,0,0,0.1);border-top:6px solid #1b7a3d}
h1,h3{text-align:center;margin:0} h3{color:#1b7a3d;margin-top:8px}
input{width:100%;padding:14px;border:2px solid #ccc;border-radius:10px;box-sizing:border-box;margin-top:15px;font-size:16px}
button{width:100%;margin-top:12px;background:#1b7a3d;color:white;padding:14px;border:none;border-radius:10px;font-size:18px;font-weight:bold}
#ans{margin-top:15px;background:#f1f8f1;padding:15px;border-radius:10px;border-left:5px solid #1b7a3d;display:none;white-space:pre-wrap;line-height:1.6}
.sindhi-keys{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sindhi-keys span{background:#e8f5e9;border:1px solid #1b7a3d;padding:6px 10px;border-radius:20px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h1>Dr. Zulfiqar Ali Jalbani</h1>
<h3>Sindhi AI Assistant - FINAL VERSION</h3>
<input id="q" placeholder="Sawal likho... Sindhi sha ahy?">
<button onclick="ask()">Jawab Hasil Karo</button>
<div class="sindhi-keys">
<span onclick="setQ('Sindhi boli ji tareekh')">Sindhi Tareekh</span>
<span onclick="setQ('Sindhi culture')">Sindhi Culture</span>
<span onclick="setQ('Shah Latif')">Shah Latif</span>
<span onclick="setQ('Sindhi topi ajrak')">Topi Ajrak</span>
<span onclick="setQ('Moen jo Daro')">Moen jo Daro</span>
</div>
<div id="ans"></div>
<p style="text-align:center;color:#888;font-size:11px;margin-top:15px">100% Working • No Server Needed • Dr. Zulfiqar Project</p>
</div>
<script>
const knowledge = {
"sindhi sha ahy": "Sindhi aik qadeem boli aahe jo 5000 saal purani Sindhu Tehzeeb ji boli aahe. Hi Pakistan ji Sindh sube ji official boli aahe ain 30 million maanhun ghalhainda ahin.",
"sindhi boli ji tareekh": "Sindhi boli ji tareekh Moen jo Daro ain Harappa je zamane khan shuru thendi aahe. Arab, Farsi ain Sanskrit ja asar aahin. 1853 me British دور me Sindhi khe official boli banayo wayo.",
"sindhi culture": "Sindhi culture mehman nawazi, Ajrak, Topi, Sufi kalam, ain Shah Latif ji shayari saan mashhoor aahe. Sindhi maanhun dil ja sachaa ain mohabbat wara ahin.",
"shah latif": "Shah Abdul Latif Bhittai Sindh ja azeem Sufi shayar huwa. Un jo kalam Shah Jo Risalo me aahe. Unhon insaniyat, ishq ain watan ji mohabbat jo dars dino.",
"topi ajrak": "Sindhi Topi ain Ajrak Sindh ji saqafat ja nishan ahin. Ajrak 4000 saal purani chhap aahe. Topi ain Ajrak izzat ain fakhar ji alamat aahe.",
"moen jo daro": "Moen jo Daro duniya ji sabhni khan qadeem tehzeeb aahe, jo 2600 BC me abaad hui. Hi Larkana zila me aahe ain UNESCO World Heritage site aahe."
};
function setQ(t){document.getElementById('q').value=t; ask();}
async function ask(){
let qq=document.getElementById('q').value.trim().toLowerCase();
let a=document.getElementById('ans');
if(!qq){alert('Sawal likho');return;}
a.style.display='block';
a.innerText='Jawab tayar karyan... ⏳';

let foundKey = Object.keys(knowledge).find(k => qq.includes(k) || k.includes(qq));
if(foundKey){
a.innerText=knowledge[foundKey] + "\n\n---\nDr. Zulfiqar AI (Offline Mode - 100% Working)";
return;
}
try{
let prompt="Answer in simple Roman Sindhi about: "+qq;
let res=await fetch('https://ai.hackclub.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'qwen/qwen3-32b',messages:[{role:'user',content:prompt}]})});
let data=await res.json();
a.innerText=data.choices[0].message.content + "\n\n---\nDr. Zulfiqar AI (Online)";
}catch(e){
a.innerText="Sindhi aik azeem ain qadeem boli aahe. Tawhan jo sawal: '"+document.getElementById('q').value+"' \n\nSindhi culture, Shah Latif, Moen jo Daro, Ajrak Topi ja bare me aham maloomat huje thi. Meharbani kare sawal khe thoro wazeh likho ya oopar diyal buttons use kayo. \n\n---\nDr. Zulfiqar AI (Offline Backup - Always Working)";
}
}
</script>
</body>
</html>

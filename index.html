
<!DOCTYPE html>
<html lang="sd">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ڊاڪٽر ذوالفقار علي جلباڻي | سنڌي AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:15px;font-family:Arial,sans-serif;
  background:#e8f5e9;display:flex;justify-content:center
}
.box{
  background:white;max-width:700px;width:100%;padding:22px;
  border-radius:20px;border-top:6px solid #1b7a3d;
  box-shadow:0 5px 20px #0002
}
.profile{text-align:center;margin:0 auto 15px}
.profile img{
  width:130px;height:130px;border-radius:50%;
  object-fit:cover;border:4px solid #1b7a3d;
  box-shadow:0 4px 12px #0002
}
h1{text-align:center;color:#174d2b;font-size:25px}
h3{text-align:center;color:#1b7a3d}
p{text-align:center;line-height:1.8}
input{
  width:100%;padding:14px;margin-top:12px;
  border:2px solid #ccc;border-radius:10px;
  font-size:17px;direction:rtl
}
button{
  width:100%;padding:13px;margin-top:10px;border:0;
  border-radius:10px;background:#1b7a3d;color:white;
  font-size:17px;cursor:pointer
}
button:disabled{opacity:.6}
.keys{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.keys button{
  flex:1 1 40%;width:auto;background:#e8f5e9;
  color:#165c30;border:1px solid #1b7a3d;font-size:14px
}
#ans{
  display:none;margin-top:16px;padding:16px;
  background:#f1f8f1;border-right:5px solid #1b7a3d;
  border-radius:10px;white-space:pre-wrap;line-height:2;
  direction:rtl;text-align:right;overflow-wrap:anywhere
}
#dictLink{text-align:center;margin-top:12px}
#dictLink a{color:#165c30;font-weight:bold}
footer{text-align:center;color:#777;font-size:12px;margin-top:20px}
</style>
</head>

<body>
<div class="box">

<div class="profile">
  <img src="zulfiqar.jpg"
       alt="ڊاڪٽر ذوالفقار علي جلباڻي"
       onerror="this.style.display='none'">
</div>

<h1>ڊاڪٽر ذوالفقار علي جلباڻي</h1>
<h3>سنڌي AI مددگار</h3>
<p>سنڌي ٻولي، ادب، تاريخ، ثقافت، پهاڪن ۽ ٻين موضوعن بابت سوال پڇو.</p>

<input id="q" placeholder="هتي پنهنجو سوال لکو..." autocomplete="off">

<button id="askBtn" onclick="ask()">آن لائين جواب حاصل ڪريو</button>
<button onclick="dictionarySearch()" style="background:#1769aa">
سنڌي لغت ۾ لفظ ڳوليو
</button>

<div class="keys">
<button onclick="setQ('شاهه عبداللطيف ڀٽائي ڪير هو؟')">شاهه لطيف</button>
<button onclick="setQ('سنڌي ٻوليءَ جي تاريخ ٻڌايو')">سنڌي ٻولي</button>
<button onclick="setQ('سنڌي ثقافت ڇا آهي؟')">سنڌي ثقافت</button>
<button onclick="setQ('موهن جو دڙو ڇا آهي؟')">موهن جو دڙو</button>
<button onclick="setQ('سنڌي پهاڪا ۽ انهن جون معنائون ٻڌايو')">سنڌي پهاڪا</button>
<button onclick="setQ('اجرڪ ۽ سنڌي ٽوپيءَ جي اهميت ٻڌايو')">اجرڪ ۽ ٽوپي</button>
<button onclick="setQ('سنڌ جي تاريخ ٻڌايو')">سنڌ جي تاريخ</button>
</div>

<div id="ans" aria-live="polite"></div>
<div id="dictLink"></div>

<footer>ڊاڪٽر ذوالفقار علي جلباڻي جو سنڌي AI منصوبو</footer>
</div>

<script>
const input=document.getElementById("q");
const answerBox=document.getElementById("ans");
const askBtn=document.getElementById("askBtn");
const dictBox=document.getElementById("dictLink");

function setQ(value){
  input.value=value;
  ask();
}

function dictionarySearch(){
  const word=input.value.trim();
  if(!word){
    alert("مهرباني ڪري پهرين لفظ يا سوال لکو.");
    return;
  }

  window.open("https://dic.sindhila.edu.pk/","_blank","noopener,noreferrer");
  dictBox.textContent="سنڌي لغت کلي وئي آهي. اتي پنهنجي لفظ جي ڳولا ڪريو.";
}

async function ask(){
  const question=input.value.trim();
  if(!question){
    alert("مهرباني ڪري سوال لکو.");
    return;
  }

  answerBox.style.display="block";
  dictBox.textContent="";
  answerBox.textContent="جواب ڳوليو پيو وڃي...";
  askBtn.disabled=true;
  askBtn.textContent="انتظار ڪريو...";

  const prompt=
    "You are an accurate Sindhi language AI assistant. "+
    "Answer the user's question in Sindhi using Sindhi Arabic script. "+
    "Do not use Roman Sindhi. If unsure, say so clearly. "+
    "Question: "+question;

  try{
    const url="https://text.pollinations.ai/"+encodeURIComponent(prompt);
    const response=await fetch(url);

    if(!response.ok)throw new Error("Service error "+response.status);

    const answer=(await response.text()).trim();
    if(!answer)throw new Error("Empty answer");

    answerBox.textContent=answer+
      "\n\n— ڊاڪٽر ذوالفقار علي جلباڻي";

  }catch(error){
    answerBox.textContent=
      "معاف ڪجو، آن لائين AI سروس هن وقت جواب نه ڏئي سگهي.\n\n"+
      "انٽرنيٽ چيڪ ڪريو ۽ ٻيهر ڪوشش ڪريو. جيڪڏهن سروس API key گهري ٿي، "+
      "ته ان کي محفوظ طريقي سان ڳنڍڻ جي ضرورت پوندي.\n\n"+
      "توهان سنڌي لغت وارو بٽڻ به استعمال ڪري سگهو ٿا.";
    console.error(error);
  }finally{
    askBtn.disabled=false;
    askBtn.textContent="آن لائين جواب حاصل ڪريو";
  }
}

input.addEventListener("keydown",function(event){
  if(event.key==="Enter")ask();
});
</script>
</body>
</html>
